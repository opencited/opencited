services:
  redis:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: valkey-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512m}

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: .env.local
        required: false
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-1500m}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
